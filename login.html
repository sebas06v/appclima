<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acceder · AppClima</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛅</text></svg>" />
</head>
<body class="pagina-auth">
  <div class="bg"></div>

  <main class="auth-wrap">
    <div class="panel auth-card">
      <div class="auth-head">
        <p class="auth-logo">⛅</p>
        <h1>AppClima</h1>
        <p class="muted small">Consulta el clima de cualquier punto del planeta</p>
      </div>

      <div class="tabs" role="tablist">
        <button class="tab is-active" data-tab="login" role="tab">Iniciar sesión</button>
        <button class="tab" data-tab="registro" role="tab">Crear cuenta</button>
      </div>

      <div id="auth-status" class="status" hidden></div>

      <!-- Acceso con Google: se muestra solo si el servidor tiene credenciales -->
      <div id="bloque-google" hidden>
        <a href="/api/auth/google" class="btn-google">
          <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.6 17.7 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-2.8-.4-4.1H24v7.4h12.7c-.3 2.1-1.6 5.3-4.7 7.4l7.3 5.6c4.3-4 6.8-9.9 6.8-16.3z"/>
            <path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-2.9-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C1 16.5 0 20.1 0 24s1 7.5 2.6 10.8l7.9-6.2z"/>
            <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.3-5.6c-2 1.4-4.6 2.3-8.6 2.3-6.3 0-11.6-4.1-13.5-9.9l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/>
          </svg>
          Continuar con Google
        </a>
        <div class="separador"><span>o</span></div>
      </div>

      <!-- Iniciar sesión -->
      <form id="form-login" class="auth-form" novalidate>
        <div class="field">
          <label for="login-email">Correo</label>
          <input id="login-email" name="email" type="email" autocomplete="email" placeholder="tucorreo@ejemplo.com" required />
        </div>
        <div class="field">
          <label for="login-password">Contraseña</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn ancho">Entrar</button>
      </form>

      <!-- Crear cuenta -->
      <form id="form-registro" class="auth-form" hidden novalidate>
        <div class="field">
          <label for="reg-nombre">Nombre</label>
          <input id="reg-nombre" name="nombre" type="text" autocomplete="name" placeholder="Tu nombre" required />
        </div>
        <div class="field">
          <label for="reg-email">Correo</label>
          <input id="reg-email" name="email" type="email" autocomplete="email" placeholder="tucorreo@ejemplo.com" required />
          <p class="ayuda">Te enviaremos un correo de bienvenida a esta dirección.</p>
        </div>
        <div class="field">
          <label for="reg-password">Contraseña</label>
          <input id="reg-password" name="password" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required />
        </div>
        <button type="submit" class="btn ancho">Crear cuenta</button>
      </form>
    </div>

    <p class="foot">
      Datos meteorológicos de <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>
    </p>
  </main>

  <script src="login.js"></script>
</body>
</html>
